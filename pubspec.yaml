name: contexto
description: "A new Flutter project for context-aware AI experience."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  sensors_plus: ^6.1.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  http: ^1.2.1
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  glassmorphism: ^3.0.0
  flutter_spinkit: ^5.2.1
  fl_chart: ^0.70.2
  get_storage: ^2.1.1

  # Notification Service ke liye naya package
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/